name: GTU TTO icerik aktarimi (tek seferlik)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/icerik-aktar.yml"

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Siteyi tara ve indir
        run: |
          cat > tara.py <<'PY'
          import os, re, json, time, hashlib, urllib.parse as up
          import requests
          from bs4 import BeautifulSoup

          BASE = "https://gtutto.com"
          OUT = "_import"
          SEEDS = ["/", "/hakkimizda", "/kurumsal-kimlik", "/yonetim-kurulu", "/ekibimiz",
                   "/kurumsal-isbirlikleri", "/haberler-duyurular", "/girisimcilerimiz",
                   "/cozum-ortaklari", "/firsatlar", "/biggbio", "/kulucka-merkezi", "/tto",
                   "/egitimler", "/faaliyetlerimiz", "/faaliyet-takvimi", "/patentler",
                   "/kariyer", "/blog", "/iletisim"]
          DOSYA_UZANTI = re.compile(r"\.(png|jpe?g|gif|webp|svg|ico|pdf|docx?|xlsx?|pptx?|zip|mp4)$", re.I)
          S = requests.Session()
          S.headers["User-Agent"] = "GTU-TTO-icerik-aktarimi/1.0 (tek seferlik tasima)"
          os.makedirs(OUT + "/html", exist_ok=True)
          os.makedirs(OUT + "/dosyalar", exist_ok=True)

          def norm(href, taban):
              if not href or href.startswith(("mailto:", "tel:", "javascript:")):
                  return None
              href = href.strip()
              # sitedeki bazı bağlantılarda başlıkta # işareti var; parça olarak değil yolun parçası olarak ele al
              if "-detail/#" in href:
                  href = href.replace("-detail/#", "-detail/%23", 1)
              u = up.urljoin(taban, href)
              p = up.urlparse(u)
              if p.netloc not in ("gtutto.com", "www.gtutto.com"):
                  return None
              return up.urlunparse(("https", "gtutto.com", p.path, "", p.query, ""))

          sayfalar, dosyalar, kuyruk, gorulen = {}, {}, [BASE + s for s in SEEDS], set()
          while kuyruk and len(gorulen) < 2000:
              url = kuyruk.pop(0)
              if url in gorulen:
                  continue
              gorulen.add(url)
              yol = up.urlparse(url).path
              if yol.startswith(("/panel/", "/assets/")) or DOSYA_UZANTI.search(yol):
                  dosyalar[url] = None
                  continue
              try:
                  r = S.get(url, timeout=30)
              except Exception as e:
                  sayfalar[url] = {"hata": str(e)}
                  continue
              time.sleep(0.3)
              if "text/html" not in r.headers.get("content-type", ""):
                  dosyalar[url] = None
                  continue
              ad = hashlib.sha1(url.encode()).hexdigest()[:12] + ".html"
              with open(f"{OUT}/html/{ad}", "w", encoding="utf-8") as f:
                  f.write(r.text)
              sayfalar[url] = {"dosya": ad, "durum": r.status_code}
              soup = BeautifulSoup(r.text, "html.parser")
              for a in soup.find_all("a", href=True):
                  n = norm(a["href"], url)
                  if n and n not in gorulen:
                      kuyruk.append(n)
              for tag in soup.find_all(["img", "source"]):
                  for attr in ("src", "data-src"):
                      n = norm(tag.get(attr), url)
                      if n:
                          dosyalar.setdefault(n, None)
                  for parca in (tag.get("srcset") or "").split(","):
                      n = norm(parca.strip().split(" ")[0], url)
                      if n:
                          dosyalar.setdefault(n, None)
              for m in re.finditer(r"url\(['\"]?([^'\")]+)['\"]?\)", r.text):
                  n = norm(m.group(1), url)
                  if n and DOSYA_UZANTI.search(up.urlparse(n).path):
                      dosyalar.setdefault(n, None)

          for url in list(dosyalar):
              yol = up.unquote(up.urlparse(url).path).lstrip("/")
              if not DOSYA_UZANTI.search(yol):
                  continue
              hedef = os.path.join(OUT, "dosyalar", yol)
              try:
                  r = S.get(url, timeout=60)
                  if r.status_code == 200:
                      os.makedirs(os.path.dirname(hedef), exist_ok=True)
                      with open(hedef, "wb") as f:
                          f.write(r.content)
                      dosyalar[url] = yol
                  time.sleep(0.2)
              except Exception as e:
                  dosyalar[url] = "HATA: " + str(e)

          with open(f"{OUT}/manifest.json", "w", encoding="utf-8") as f:
              json.dump({"sayfalar": sayfalar, "dosyalar": dosyalar}, f, ensure_ascii=False, indent=1)
          print("Sayfa:", len(sayfalar), "Dosya:", sum(1 for v in dosyalar.values() if v and not str(v).startswith("HATA")))
          PY
          python tara.py
      - name: Depoya kaydet
        run: |
          git config user.name "icerik-aktarimi"
          git config user.email "actions@github.com"
          git add _import
          git commit -m "GTÜ TTO ham içerik ve görselleri (aktarım için)" || echo "Değişiklik yok"
          git push
