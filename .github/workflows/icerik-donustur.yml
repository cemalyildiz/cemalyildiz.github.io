name: GTU TTO icerik donusturme (tek seferlik)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/icerik-donustur.yml"

permissions:
  contents: write

jobs:
  donustur:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 markdownify pyyaml pillow
      - name: Deneme iceriklerini sil
        run: |
          rm -f _cagrilar/*ornek*.md _ziyaretler/*ornek*.md _etkinlikler/*ornek*.md
          rm -f _duyurular/2026-09-23-duyuru-3.md _duyurular/2026-09-24-duyuru-2.md _duyurular/2026-09-25-duyuru-1.md
          rm -f _ekip/cemal.md _ekip/cemal-yildiz.md _ekip/cemal-yildiz-1.md
          rm -f assets/img/IMG-20251003-WA0017.jpg
          printf -- "---\ntitle: Ekibimiz\npermalink: /kurumsal/ekibimiz/\nliste: ekip\n---\n" > sayfalar/ekibimiz.md
      - name: Donustur
        run: python _araclar/donustur.py
      - name: Temizle ve kaydet
        run: |
          git rm -r -q --cached _import || true
          rm -rf _import
          git rm -q --ignore-unmatch .github/workflows/icerik-aktar.yml .github/workflows/icerik-donustur.yml _araclar/donustur.py
          git config user.name "icerik-aktarimi"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "GTÜ TTO içerikleri siteye aktarıldı, deneme içerikleri ve ham dosyalar kaldırıldı" || echo "Degisiklik yok"
          git push
